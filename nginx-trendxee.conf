# ──────────────────────────────────────────────────────────────
# TrendXee Nginx Reverse Proxy Configuration
# Place at:  /etc/nginx/sites-available/trendxee
# Then run:
#   sudo ln -sf /etc/nginx/sites-available/trendxee /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d api.trendxee.com -d auth.trendxee.com
# ──────────────────────────────────────────────────────────────

# Search: 10 requests/second per visitor, with short bursts while typing.
# If a server (e.g. frontend SSR) calls search, all its visitors share one IP:
# exempt that IP here before deploying, or they will share one limit.
limit_req_zone $binary_remote_addr zone=trendxee_search:10m rate=10r/s;

# Trend API  →  api.trendxee.com  →  localhost:8080
server {
    listen 80;
    server_name api.trendxee.com;

    location = /api/v2/search {
        limit_req zone=trendxee_search burst=20 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebFlux streaming support
        proxy_buffering off;
        proxy_read_timeout 300s;
    }
}

# Business API  →  auth.trendxee.com  →  localhost:8081
server {
    listen 80;
    server_name auth.trendxee.com;

    location / {
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
