# ──────────────────────────────────────────────────────────────
# TrendXee Nginx Reverse Proxy Configuration
#
# Now run as a container on the trendxee-internal Docker network
# (see docker-compose.prod.yml), so upstreams are resolved via Docker DNS.
#
# For the initial TLS certificate, use the certbot webroot plugin:
#   sudo certbot certonly --webroot -w /var/www/certbot \
#     -d api.trendxee.com -d auth.trendxee.com
# then add the 443 server blocks that reference
#   /etc/letsencrypt/live/api.trendxee.com/fullchain.pem
#   /etc/letsencrypt/live/api.trendxee.com/privkey.pem
# ──────────────────────────────────────────────────────────────

# Trend API  →  api.trendxee.com  →  trendzy_api:8080
server {
    listen 80;
    server_name api.trendxee.com;

    # Security headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-XSS-Protection "1; mode=block" always;

    location / {
        proxy_pass http://trendzy_api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebFlux streaming support
        proxy_buffering off;
        proxy_read_timeout 300s;
    }
}

# Business API  →  auth.trendxee.com  →  trendzy_business:8081
server {
    listen 80;
    server_name auth.trendxee.com;

    # Security headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-XSS-Protection "1; mode=block" always;

    location / {
        proxy_pass http://trendzy_business:8081;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
