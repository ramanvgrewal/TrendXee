# ──────────────────────────────────────────────────────────────
# TrendXee Nginx Reverse Proxy Configuration
# Place at:  /etc/nginx/sites-available/trendxee
# Then run:
#   sudo ln -sf /etc/nginx/sites-available/trendxee /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d api.trendxee.com -d auth.trendxee.com
# ──────────────────────────────────────────────────────────────

# Trend API  →  api.trendxee.com  →  localhost:8080
server {
    listen 80;
    server_name api.trendxee.com;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebFlux streaming support
        proxy_buffering off;
        proxy_read_timeout 300s;
    }
}

# Business API  →  auth.trendxee.com  →  localhost:8081
server {
    listen 80;
    server_name auth.trendxee.com;

    location / {
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
