networks:
  trendxee-internal:
    driver: bridge

services:
  api:
    image: ghcr.io/ramanvgrewal/trendxee/trend-api:latest
    container_name: trendzy_api
    restart: always
    # No host port exposure — accessible only via nginx on the internal network
    expose:
      - "8080"
    networks:
      - trendxee-internal
    env_file:
      - .env
    volumes:
      - ./public.pem:/run/secrets/trendzy-public.pem:ro
    environment:
      JAVA_TOOL_OPTIONS: "-Xmx256m -Xms128m"
      JWT_PUBLIC_KEY_PATH: "file:/run/secrets/trendzy-public.pem"

  business:
    image: ghcr.io/ramanvgrewal/trendxee/business-api:latest
    container_name: trendzy_business
    restart: always
    expose:
      - "8081"
    networks:
      - trendxee-internal
    env_file:
      - .env
    volumes:
      - ./private.pem:/run/secrets/trendzy-private.pem:ro
      - ./public.pem:/run/secrets/trendzy-public.pem:ro
    environment:
      JAVA_TOOL_OPTIONS: "-Xmx256m -Xms128m"
      JWT_PRIVATE_KEY_PATH: "file:/run/secrets/trendzy-private.pem"
      JWT_PUBLIC_KEY_PATH: "file:/run/secrets/trendzy-public.pem"

  nginx:
    image: nginx:1.27-alpine
    container_name: trendzy_nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    networks:
      - trendxee-internal
    volumes:
      - ./nginx-trendxee.conf:/etc/nginx/conf.d/default.conf:ro
      # TLS certs issued by certbot must live here (use the webroot plugin)
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - api
      - business
