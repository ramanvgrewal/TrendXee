server:
  port: ${API_PORT:8080}
  forward-headers-strategy: framework

spring:
  config:
    import: optional:file:../.env[.properties],optional:file:.env[.properties]
  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://localhost:27017/trendzy}

app:
  outfits:
    enabled: ${OUTFIT_VISUAL_ENABLED:true}
    feedback-enabled: ${OUTFIT_FEEDBACK_ENABLED:false}
    feedback-secret: ${OUTFIT_FEEDBACK_SECRET:}
  jwt:
    public-key-path: ${JWT_PUBLIC_KEY_PATH:classpath:keys/public.pem}
  cors:
    # Comma-separated exact https origins, e.g. one Vercel preview URL. No wildcards.
    extra-origins: ${CORS_EXTRA_ORIGINS:}
  cookie:
    name: ${COOKIE_NAME:trendxee_token}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha

sentry:
  dsn: ${SENTRY_DSN:}
  environment: ${SENTRY_ENVIRONMENT:production}
  traces-sample-rate: 0.05
  send-default-pii: false
  tags:
    service: trend-api
